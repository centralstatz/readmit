name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Measure package coverage
        run: |
          coverage <- covr::package_coverage(quiet = FALSE)
          print(coverage)
          covr::to_cobertura(coverage, filename = "cobertura.xml")
        shell: Rscript {0}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
